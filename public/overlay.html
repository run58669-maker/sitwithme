<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Sit With Me Overlay</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <canvas id="room" aria-label="A pixel room with chairs for Twitch viewers"></canvas>
    <script>
      (() => {
        "use strict";

        const canvas = document.getElementById("room");
        const context = canvas.getContext("2d");
        const WIDTH = 960;
        const HEIGHT = 540;
        const scaleValue = Number(new URLSearchParams(location.search).get("scale") || "1");
        const overlayScale = Number.isFinite(scaleValue) ? Math.min(3, Math.max(0.5, scaleValue)) : 1;
        const PALETTES = {
          "cozy-orange": {
            outline: "#291a35", outlineSoft: "#4a2944", wall: "#bd765f", wallLight: "#e5ad79",
            wood: "#9f553a", woodLight: "#d98247", woodDark: "#603142", honey: "#f2ad59",
            cream: "#fff1c9", plum: "#5c3462", dusk: "#4a3a73", duskLight: "#b55d78",
            teal: "#3f7c72", leaf: "#456348", rug: "#b95563", rugLight: "#e88972",
            residentOne: "#728b7d", residentTwo: "#88728b", residentThree: "#9a806a",
            smoke: "#766171", fire: "#e66b3e", firebox: "#3d2537", skin: "#f1b58d",
            residentSkin: "#d8a487", residentLabel: "#ddd3bd", cat: "#6d5960",
          },
          "night-blue": {
            outline: "#11182e", outlineSoft: "#293d66", wall: "#4e6694", wallLight: "#829ac7",
            wood: "#344c73", woodLight: "#5978a7", woodDark: "#17233f", honey: "#d6b66d",
            cream: "#eef3ff", plum: "#394b78", dusk: "#1d2c54", duskLight: "#59658f",
            teal: "#4f8395", leaf: "#4d6d72", rug: "#53658e", rugLight: "#91a7cc",
            residentOne: "#6c8292", residentTwo: "#7a7793", residentThree: "#829093",
            smoke: "#63708a", fire: "#df7655", firebox: "#151d35", skin: "#e2ae92",
            residentSkin: "#c79c8a", residentLabel: "#d9e1ef", cat: "#596477",
          },
          forest: {
            outline: "#1f2a27", outlineSoft: "#35483c", wall: "#647a52", wallLight: "#9caf79",
            wood: "#765940", woodLight: "#a17b50", woodDark: "#3a3b2f", honey: "#c4b77c",
            cream: "#f2efd0", plum: "#5b5342", dusk: "#40533b", duskLight: "#71805a",
            teal: "#47736b", leaf: "#3f6043", rug: "#6f8157", rugLight: "#a4a968",
            residentOne: "#71826c", residentTwo: "#817a69", residentThree: "#6c807a",
            smoke: "#657067", fire: "#cf7047", firebox: "#26382e", skin: "#e1b18c",
            residentSkin: "#cda184", residentLabel: "#dce0c5", cat: "#5e685e",
          },
          candy: {
            outline: "#3b2744", outlineSoft: "#684466", wall: "#c47aa5", wallLight: "#f2b5d4",
            wood: "#9a617f", woodLight: "#d391ae", woodDark: "#563858", honey: "#ffe0a8",
            cream: "#fff4f4", plum: "#815080", dusk: "#6a548b", duskLight: "#b881bd",
            teal: "#69a1a0", leaf: "#708b75", rug: "#ca8ac1", rugLight: "#f0aac5",
            residentOne: "#8c8198", residentTwo: "#9a7f91", residentThree: "#829398",
            smoke: "#826f84", fire: "#f06c76", firebox: "#4a304b", skin: "#f0b59c",
            residentSkin: "#d9a28f", residentLabel: "#f3dce4", cat: "#766678",
          },
        };
        let palette = PALETTES["cozy-orange"];
        let roomState = {
          chairs: 6,
          seats: Array(6).fill(null),
          idle: false,
          residents: [],
          palette: "cozy-orange",
        };
        let reconnectAttempt = 0;
        let lastWavingCount = -1;
        let lastRuntimeKey = "";
        let hasReceivedState = false;

        function updateAccessibility() {
          const seatedCount = roomState.seats.filter(Boolean).length;
          canvas.dataset.seatedCount = String(seatedCount);
          canvas.dataset.idle = String(Boolean(roomState.idle));
          canvas.setAttribute(
            "aria-label",
            `A pixel room with ${roomState.chairs} chairs, ${seatedCount} seated viewers, and idle mode ${roomState.idle ? "on" : "off"}`,
          );
        }

        function updateRuntimeMetadata(now) {
          const activeResidents = roomState.residents.filter((resident) => resident.action !== "quiet").length;
          const viewerBubbles = roomState.seats.filter(
            (viewer) => viewer?.bubble && Number(viewer.bubble.expiresAt) > now,
          ).length;
          const residentBubbles = roomState.residents.filter(
            (resident) => resident.bubble && Number(resident.bubble.expiresAt) > now,
          ).length;
          const key = `${activeResidents}:${viewerBubbles}:${residentBubbles}:${roomState.idle}`;
          if (key === lastRuntimeKey) return;
          lastRuntimeKey = key;
          canvas.dataset.activeResidents = String(activeResidents);
          canvas.dataset.viewerBubbles = String(viewerBubbles);
          canvas.dataset.residentBubbles = String(residentBubbles);
          canvas.dataset.idle = String(Boolean(roomState.idle));
        }

        function resize() {
          const ratio = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.round(window.innerWidth * ratio);
          canvas.height = Math.round(window.innerHeight * ratio);
          context.imageSmoothingEnabled = false;
        }

        function rect(x, y, width, height, color) {
          context.fillStyle = color;
          context.fillRect(Math.round(x), Math.round(y), Math.round(width), Math.round(height));
        }

        function line(x1, y1, x2, y2, color, width = 2) {
          context.strokeStyle = color;
          context.lineWidth = width;
          context.beginPath();
          context.moveTo(Math.round(x1), Math.round(y1));
          context.lineTo(Math.round(x2), Math.round(y2));
          context.stroke();
        }

        function chairPositions(count) {
          const positions = [];
          const columns = Math.min(count, 8);
          const startX = WIDTH / 2 - ((columns - 1) * 92) / 2;
          for (let index = 0; index < count; index += 1) {
            const row = Math.floor(index / 8);
            const rowCount = Math.min(8, count - row * 8);
            const rowStart = WIDTH / 2 - ((rowCount - 1) * 92) / 2;
            positions.push({ x: rowStart + (index % 8) * 92, y: 372 + row * 68 });
          }
          return positions;
        }

        function drawFireplace(now) {
          rect(690, 221, 83, 75, palette.outline);
          rect(699, 229, 65, 67, palette.woodDark);
          rect(707, 248, 49, 48, palette.outlineSoft);
          rect(713, 257, 37, 39, palette.firebox);
          rect(684, 213, 95, 12, palette.outline);
          rect(691, 216, 81, 7, palette.wood);
          const flicker = Math.floor(now / (roomState.idle ? 120 : 220)) % 3;
          rect(725, 276 - flicker * 2, 13, 19 + flicker * 2, palette.fire);
          rect(730, 269 + flicker, 9, 24 - flicker, palette.honey);
          rect(735, 280 - flicker * 3, 8, 15 + flicker * 2, palette.cream);
          if (roomState.idle && flicker === 1) rect(747, 269, 5, 8, palette.fire);
        }

        function drawCat(now) {
          const cycle = now % 14000;
          const stretching = roomState.idle && cycle < 2500;
          const x = 802;
          const y = 266;
          const fur = palette.cat;
          if (stretching) {
            rect(x, y + 8, 43, 11, palette.outline);
            rect(x + 4, y + 9, 34, 8, fur);
            rect(x + 35, y + 4, 13, 13, palette.outline);
            rect(x + 38, y + 7, 8, 8, fur);
            rect(x + 38, y + 1, 4, 7, fur);
            rect(x + 44, y + 2, 4, 6, fur);
            rect(x - 8, y + 15, 15, 4, palette.outline);
          } else {
            rect(x + 7, y + 5, 26, 18, palette.outline);
            rect(x + 10, y + 8, 20, 13, fur);
            rect(x + 27, y, 14, 16, palette.outline);
            rect(x + 30, y + 4, 8, 9, fur);
            rect(x + 29, y - 4, 4, 7, fur);
            rect(x + 36, y - 3, 4, 7, fur);
            rect(x, y + 17, 12, 5, palette.outline);
          }
        }

        function drawRoom(now) {
          rect(94, 123, 772, 278, palette.outline);
          rect(102, 131, 756, 262, palette.wall);
          rect(102, 131, 756, 172, palette.wallLight);
          rect(102, 296, 756, 97, palette.woodLight);

          for (let y = 312; y < 393; y += 19) line(102, y, 858, y, palette.wood, 3);
          for (let x = 118; x < 858; x += 63) line(x, 296, x - 15, 393, palette.wood, 2);
          rect(77, 393, 806, 22, palette.outline);
          rect(88, 393, 784, 13, palette.wood);
          rect(107, 406, 746, 10, palette.woodDark);

          rect(379, 151, 202, 105, palette.outline);
          rect(386, 158, 188, 91, palette.dusk);
          rect(389, 207, 182, 39, palette.duskLight);
          rect(477, 158, 7, 91, palette.outlineSoft);
          rect(386, 201, 188, 7, palette.outlineSoft);
          for (const [x, y] of [[408, 177], [438, 190], [528, 175], [548, 195]]) rect(x, y, 4, 4, palette.cream);
          rect(420, 224, 24, 22, palette.plum);
          rect(523, 218, 31, 28, palette.plum);

          rect(151, 179, 111, 8, palette.outlineSoft);
          rect(159, 160, 12, 19, palette.plum);
          rect(176, 154, 11, 25, palette.teal);
          rect(192, 158, 14, 21, palette.wood);
          rect(217, 160, 29, 19, palette.leaf);
          rect(225, 149, 10, 17, palette.leaf);

          rect(737, 172, 62, 7, palette.outlineSoft);
          rect(750, 158, 10, 14, palette.leaf);
          rect(765, 149, 16, 23, palette.leaf);
          rect(786, 161, 9, 11, palette.leaf);

          drawFireplace(now);
          drawCat(now);

          rect(287, 331, 386, 48, palette.outlineSoft);
          rect(297, 337, 366, 36, palette.rug);
          rect(319, 344, 322, 22, palette.rugLight);
          for (let x = 337; x < 635; x += 40) rect(x, 352, 14, 6, palette.cream);
        }

        function drawChair(x, y) {
          rect(x - 29, y - 45, 58, 58, palette.outline);
          rect(x - 23, y - 39, 46, 36, palette.wood);
          rect(x - 19, y - 34, 38, 8, palette.woodLight);
          rect(x - 19, y - 19, 38, 6, palette.woodLight);
          rect(x - 26, y - 2, 52, 17, palette.outline);
          rect(x - 20, y + 3, 40, 10, palette.rugLight);
          rect(x - 24, y + 13, 8, 24, palette.outline);
          rect(x + 16, y + 13, 8, 24, palette.outline);
          rect(x - 20, y + 13, 6, 20, palette.wood);
          rect(x + 14, y + 13, 6, 20, palette.wood);
        }

        function hashColor(name) {
          let hash = 2166136261;
          for (let index = 0; index < name.length; index += 1) {
            hash ^= name.charCodeAt(index);
            hash = Math.imul(hash, 16777619);
          }
          const hue = Math.abs(hash) % 360;
          return `hsl(${hue} 48% 55%)`;
        }

        function decodeHtml(text) {
          return text
            .replaceAll("&lt;", "<")
            .replaceAll("&gt;", ">")
            .replaceAll("&quot;", '"')
            .replaceAll("&#39;", "'")
            .replaceAll("&amp;", "&");
        }

        function bubbleLines(text, maximumWidth) {
          const lines = [];
          let current = "";
          for (const character of Array.from(text)) {
            const candidate = `${current}${character}`;
            if (context.measureText(candidate).width <= maximumWidth || current.length === 0) {
              current = candidate;
            } else {
              lines.push(current.trimEnd());
              current = character === " " ? "" : character;
            }
          }
          if (current) lines.push(current);
          if (lines.length === 0) lines.push("…");
          if (lines.length > 2) {
            lines[1] = `${lines.slice(1).join("").slice(0, 18)}…`;
            lines.length = 2;
          }
          return lines;
        }

        function drawBubble(text, x, bottomY) {
          context.font = "bold 12px monospace";
          context.textAlign = "left";
          context.textBaseline = "top";
          const lines = bubbleLines(text, 150);
          const textWidth = Math.max(...lines.map((lineText) => context.measureText(lineText).width), 30);
          const width = Math.min(166, Math.max(58, textWidth + 16));
          const height = 12 + lines.length * 15;
          const left = Math.max(8, Math.min(WIDTH - width - 8, x - width / 2));
          const top = bottomY - height - 8;
          rect(left, top, width, height, palette.outline);
          rect(left + 4, top + 4, width - 8, height - 8, palette.cream);
          rect(x - 5, bottomY - 9, 10, 8, palette.outline);
          rect(x - 3, bottomY - 9, 6, 5, palette.cream);
          context.fillStyle = palette.outline;
          lines.forEach((lineText, index) => context.fillText(lineText, left + 8, top + 7 + index * 15));
        }

        function ellipsizeLabel(text, maximumWidth) {
          if (context.measureText(text).width <= maximumWidth) return text;
          const characters = Array.from(text);
          const ellipsis = "…";
          while (characters.length > 0 && context.measureText(`${characters.join("")}${ellipsis}`).width > maximumWidth) {
            characters.pop();
          }
          return `${characters.join("")}${ellipsis}`;
        }

        function drawNameLabel(name, x, bottomY, color) {
          context.font = "bold 12px monospace";
          context.textAlign = "center";
          context.textBaseline = "bottom";
          context.lineWidth = 4;
          const label = ellipsizeLabel(name, 86);
          context.strokeStyle = palette.outline;
          context.strokeText(label, x, bottomY);
          context.fillStyle = color;
          context.fillText(label, x, bottomY);
        }

        function drawPerson(viewer, x, y, now) {
          const scale = 3;
          const originX = Math.round(x - 8 * scale);
          const originY = Math.round(y - 42);
          const color = hashColor(viewer.displayName);
          const skin = palette.skin;
          const hair = palette.outlineSoft;
          const waving = Number(viewer.waveUntil || 0) > now;
          const wavePhase = Math.floor(now / 140) % 2;

          const pixel = (px, py, width, height, fill) => {
            rect(originX + px * scale, originY + py * scale, width * scale, height * scale, fill);
          };

          pixel(5, 0, 6, 2, hair);
          pixel(3, 2, 10, 5, hair);
          pixel(4, 4, 8, 5, skin);
          pixel(4, 3, 2, 3, hair);
          pixel(10, 3, 2, 3, hair);
          pixel(6, 6, 1, 1, palette.outline);
          pixel(9, 6, 1, 1, palette.outline);
          pixel(5, 9, 6, 5, color);
          pixel(3, 10, 2, 4, color);
          if (waving) {
            const handY = wavePhase ? 5 : 3;
            pixel(11, 9, 2, 2, color);
            pixel(13, handY, 2, 6, skin);
            pixel(14, handY - 1, 1, 2, skin);
          } else {
            pixel(11, 10, 2, 4, color);
          }
          pixel(5, 14, 3, 2, palette.plum);
          pixel(9, 14, 3, 2, palette.plum);
          if (viewer.bubble && Number(viewer.bubble.expiresAt) > now) {
            drawBubble(decodeHtml(viewer.bubble.text), x, originY - 28);
          }
        }

        function drawResident(resident, positions, now) {
          if (resident.action === "quiet") return;
          const seatedPosition = resident.chairIndex === null ? null : positions[resident.chairIndex];
          const x = seatedPosition?.x ?? resident.x;
          const y = seatedPosition?.y ?? resident.y;
          const scale = 3;
          const walkingBob = resident.action === "walking" ? Math.floor(now / 180) % 2 : 0;
          const originX = Math.round(x - 8 * scale);
          const originY = Math.round(y - 42 - walkingBob);
          const colors = [palette.residentOne, palette.residentTwo, palette.residentThree];
          const color = colors[resident.paletteIndex % colors.length];
          const skin = palette.residentSkin;
          const hair = palette.smoke;
          const stretching = resident.action === "stretching";

          const pixel = (px, py, width, height, fill) => {
            rect(originX + px * scale, originY + py * scale, width * scale, height * scale, fill);
          };
          pixel(4, 1, 8, 2, hair);
          pixel(3, 3, 10, 4, hair);
          pixel(4, 4, 8, 5, skin);
          pixel(5, 4, 2, 2, hair);
          pixel(9, 4, 2, 2, hair);
          pixel(6, 6, 1, 1, palette.outline);
          pixel(9, 6, 1, 1, palette.outline);
          pixel(5, 9, 6, 5, color);
          if (stretching) {
            pixel(1, 7, 4, 2, color);
            pixel(11, 7, 4, 2, color);
            pixel(0, 6, 2, 2, skin);
            pixel(14, 6, 2, 2, skin);
          } else {
            pixel(3, 10, 2, 4, color);
            pixel(11, 10, 2, 4, color);
          }
          pixel(5, 14, 3, 2, palette.woodDark);
          pixel(9, 14, 3, 2, palette.woodDark);
          if (resident.bubble && Number(resident.bubble.expiresAt) > now) {
            drawBubble(resident.bubble.text, x, originY - 25);
          }
        }

        function render(now) {
          const wallClock = Date.now();
          updateRuntimeMetadata(wallClock);
          const wavingCount = roomState.seats.filter(
            (viewer) => viewer && Number(viewer.waveUntil || 0) > wallClock,
          ).length;
          if (wavingCount !== lastWavingCount) {
            canvas.dataset.wavingCount = String(wavingCount);
            lastWavingCount = wavingCount;
          }
          const ratio = Math.min(canvas.width / WIDTH, canvas.height / HEIGHT) * overlayScale;
          const offsetX = (canvas.width - WIDTH * ratio) / 2;
          const offsetY = (canvas.height - HEIGHT * ratio) / 2;
          context.setTransform(1, 0, 0, 1, 0, 0);
          context.clearRect(0, 0, canvas.width, canvas.height);
          context.setTransform(ratio, 0, 0, ratio, offsetX, offsetY);
          drawRoom(wallClock);
          const positions = chairPositions(roomState.chairs);
          positions.forEach((position) => drawChair(position.x, position.y));
          roomState.residents.forEach((resident) => drawResident(resident, positions, wallClock));
          positions.forEach((position, index) => {
            const viewer = roomState.seats[index];
            if (viewer) drawPerson(viewer, position.x, position.y, wallClock);
          });
          roomState.residents.forEach((resident) => {
            if (resident.action === "quiet") return;
            const seatedPosition = resident.chairIndex === null ? null : positions[resident.chairIndex];
            const x = seatedPosition?.x ?? resident.x;
            const y = seatedPosition?.y ?? resident.y;
            const walkingBob = resident.action === "walking" ? Math.floor(wallClock / 180) % 2 : 0;
            drawNameLabel(resident.name, x, Math.round(y - 49 - walkingBob), palette.residentLabel);
          });
          positions.forEach((position, index) => {
            const viewer = roomState.seats[index];
            if (viewer) drawNameLabel(viewer.displayName, position.x, position.y - 50, palette.cream);
          });
          requestAnimationFrame(render);
        }

        function applyState(message) {
          if (
            !message ||
            !Number.isInteger(message.chairs) ||
            !Array.isArray(message.seats) ||
            !Array.isArray(message.residents)
          ) {
            return false;
          }
          roomState = {
            chairs: message.chairs,
            seats: message.seats,
            idle: Boolean(message.idle),
            residents: message.residents,
            palette: PALETTES[message.palette] ? message.palette : "cozy-orange",
          };
          palette = PALETTES[roomState.palette];
          canvas.dataset.palette = roomState.palette;
          hasReceivedState = true;
          updateAccessibility();
          return true;
        }

        async function loadInitialState() {
          try {
            const response = await fetch("/api/state", { cache: "no-store" });
            if (!response.ok) return;
            const message = await response.json();
            if (hasReceivedState) return;
            applyState({
              chairs: message.room?.chairs,
              seats: message.room?.seats,
              idle: message.idle,
              residents: message.residents,
              palette: message.palette,
            });
          } catch {
            // The WebSocket connection remains the primary live-state path.
          }
        }

        function connect() {
          const protocol = location.protocol === "https:" ? "wss:" : "ws:";
          const socket = new WebSocket(`${protocol}//${location.host}/ws`);
          socket.addEventListener("open", () => { reconnectAttempt = 0; });
          socket.addEventListener("message", (event) => {
            let message;
            try { message = JSON.parse(event.data); } catch { return; }
            if (message.type === "state") applyState(message);
            if (message.type === "event" && message.event === "wave") {
              const viewer = roomState.seats[message.chairIndex];
              if (viewer) viewer.waveUntil = message.waveUntil || Date.now() + 1500;
            }
          });
          socket.addEventListener("close", () => {
            const delay = Math.min(1000 * 2 ** reconnectAttempt, 10000);
            reconnectAttempt += 1;
            window.setTimeout(connect, delay);
          });
        }

        window.addEventListener("resize", resize);
        resize();
        canvas.dataset.scale = String(overlayScale);
        updateAccessibility();
        void loadInitialState();
        connect();
        requestAnimationFrame(render);
      })();
    </script>
  </body>
</html>
